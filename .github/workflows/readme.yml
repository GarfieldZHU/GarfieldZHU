name: Update Waka Readme

permissions:
  contents: write

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/readme.yml'
      - 'scripts/update-wakatime.py'
  schedule:
    # Runs at 12am IST
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README from the public WakaTime profile
        env:
          WAKATIME_USERNAME: AlohaYo
        run: python3 scripts/update-wakatime.py
      - name: Commit updated stats
        run: |
          if git diff --quiet -- README.md; then
            echo "WakaTime stats have not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update WakaTime stats"
          git push origin HEAD:master
