<svg xmlns="http://www.w3.org/2000/svg" width="640" height="322" viewBox="0 0 640 322" role="img" aria-labelledby="title description">
  <title id="title">WakaTime coding activity</title>
  <desc id="description">Programming language usage over the last seven days. Total coding time: 3 hrs 28 mins.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <style>
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; }
      .title { fill: #f8fafc; font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #94a3b8; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .total { fill: #e2e8f0; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .language { fill: #e2e8f0; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .duration { fill: #94a3b8; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .percent { fill: #cbd5e1; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .track { fill: #263244; }
      .bar { fill: url(#accent); }
      .empty { fill: #cbd5e1; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="638" height="320" rx="18" class="card" />
  <circle cx="39" cy="39" r="17" fill="url(#accent)" />
  <text x="39" y="45" text-anchor="middle" fill="#111827" font-family="sans-serif" font-size="17" font-weight="700">W</text>
  <text x="66" y="37" class="title">WakaTime</text>
  <text x="66" y="57" class="subtitle">Top languages · last 7 days</text>
  <text x="608" y="31" class="subtitle" text-anchor="end">TOTAL TIME</text>
  <text x="608" y="52" class="total" text-anchor="end">3 hrs 28 mins</text>
  <line x1="26" y1="78" x2="614" y2="78" stroke="#334155" />
  <g class="language-row">
    <text x="32" y="126" class="language">Java</text>
    <text x="168" y="126" class="duration">1 hr 39 mins</text>
    <rect x="288" y="115" width="276" height="8" rx="4" class="track" />
    <rect x="288" y="115" width="131" height="8" rx="4" class="bar" />
    <text x="594" y="126" class="percent" text-anchor="end">47.6%</text>
  </g>
  <g class="language-row">
    <text x="32" y="161" class="language">TypeScript</text>
    <text x="168" y="161" class="duration">35 mins</text>
    <rect x="288" y="150" width="276" height="8" rx="4" class="track" />
    <rect x="288" y="150" width="46" height="8" rx="4" class="bar" />
    <text x="594" y="161" class="percent" text-anchor="end">16.8%</text>
  </g>
  <g class="language-row">
    <text x="32" y="196" class="language">JavaScript</text>
    <text x="168" y="196" class="duration">30 mins</text>
    <rect x="288" y="185" width="276" height="8" rx="4" class="track" />
    <rect x="288" y="185" width="40" height="8" rx="4" class="bar" />
    <text x="594" y="196" class="percent" text-anchor="end">14.6%</text>
  </g>
  <g class="language-row">
    <text x="32" y="231" class="language">YAML</text>
    <text x="168" y="231" class="duration">19 mins</text>
    <rect x="288" y="220" width="276" height="8" rx="4" class="track" />
    <rect x="288" y="220" width="26" height="8" rx="4" class="bar" />
    <text x="594" y="231" class="percent" text-anchor="end">9.3%</text>
  </g>
  <g class="language-row">
    <text x="32" y="266" class="language">JSON</text>
    <text x="168" y="266" class="duration">11 mins</text>
    <rect x="288" y="255" width="276" height="8" rx="4" class="track" />
    <rect x="288" y="255" width="15" height="8" rx="4" class="bar" />
    <text x="594" y="266" class="percent" text-anchor="end">5.5%</text>
  </g>
  <text x="32" y="300" class="subtitle">Updated from my public WakaTime profile</text>
</svg>
